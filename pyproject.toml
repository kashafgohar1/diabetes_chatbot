[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-triage-chatbot"
version = "0.1.0"
description = "Prototype deterministic-core diabetes triage chatbot (MS AI capstone, LUMS)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
